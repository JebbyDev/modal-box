<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>
        *{
         margin: 0px;
         padding: 0px;
         box-sizing: border-box;

        }

        .overallWrapper{
            width: 100%;
            height: 100vh;
            background-color: #f5f5f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            
        

        }

        .header{
            width: 100%;
            height: 80px;
            background-color: yellow;
            display: flex;
            justify-content: space-around;
            margin-bottom: 50px;
    
        }

        #logoContainer{
            width: 20%;
        }

        #logoContainer img{
            width: 70px;
            height: 70px;
            border-radius: 50%;
            cursor: pointer;
        }

        #navLinkContainer{
            width: 70%;
        }

        #navLinkContainer ul{
           display: flex;
           justify-content: space-between;
           margin-top: 20px;
           
        }

        #navLinkContainer ul li{
           list-style: none; 
        }

        #navLinkContainer ul li a{
            text-decoration: none;
            font-size: 18px;
            text-transform: uppercase;
            color: red;
            font-weight: bold;
            padding: 5px 10px;
            
        }



        .Login{
            padding: 10px 15px;
            background-color: #ff7000;
            border: none;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            transition: .5s;
        }

        .Login{
            background-color: #e06100;
        }

        .modalBoxOverallContainer{
            width: 100%;
            height: 100vh;
            background-color: rgba(0,0,0,0,5);
            position: absolute;
            display: flex;
            justify-content: center;
            align-items: center;
            visibility: hidden;   


        }

        .showmodalBoxOverallContainer{
            visibility: visible;
            transition: .8s;
        }

        .modalBox{
         background-color: #fff;
         padding: 30px;
         width: 400px;
         scale: 0.1;
         visibility: hidden;
         transition: .8s;
        }

        .showmodalBox{
            visibility: visible;
            scale: 1;
        }

        .modalBox h1{
            text-align: center;
            margin-bottom: 30px;
        }

        .modalBox label{
            width: 20%;
            line-height: 40px;
        }

        .modalBox input{
            width: 75%;
            float: right;
            height: 40px;
        }

        .modalBox button{
            width: 100%;
            height: 40px;
            margin-top: 20px;
            background-color: #ff7000;
            border: none;
            color: #fff;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
    <div class="overallWrapper">
        <div class="header">
        <div id="logoContainer">
            <img src="5.0png.png" alt="logo">
        </div>
         <div id="navLinkContainer">
            <ul>
                <li><a href="">Home</a></li>
                <li><a href="">About</a></li>
                <li><a href="">Services</a></li>
                <li><a href="">Portfolio</a></li>
                <li><a href="">Contact</a></li>
                <button class="Login">Login</button>

            </ul>
         </div>
        

        </div>
        <!-- <button class="Login">Login</button> -->

        <div class="modalBoxOverallContainer">
            <div class="modalBox">
                <h1>Login Form</h1>
                <form action="">
                    <label for="">Username:</label>
                    <input type="text">
                    <br><br>

                    <label for="">Password</label>
                    <input type="Password">
                    <br><br>

                    <button>Log In</button>
                
                </form>
            </div>
        </div>
    </div>
    <script>
        const Login = document.querySelector('.Login');
        const modalBoxOverallContainer = document.querySelector('.modalBoxOverallContainer');
        const modalBox = document.querySelector('.modalBox');

        Login.addEventListener('click', function(){
          modalBoxOverallContainer.classList.add('showmodalBoxOverallContainer');
          modalBox.classList.add('showmodalBox');
        })
    </script>
    

</body>
</html>
